services:
  gameshelf-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gameshelf-db
    restart: unless-stopped
    ports:
      - "${H2_PORT:-9092}:9092"
    environment:
      H2_PORT: "${H2_PORT:-9092}"
    volumes:
      - gameshelf_data:/data

volumes:
  gameshelf_data:
